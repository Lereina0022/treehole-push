name: Treehole Push

on:
  schedule:
    - cron: "17 */4 * * *"

  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: subscription

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: subscription/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search and push
        run: python -m app.runner
        env:
          TREEHOLE_AUTHORIZATION: ${{ secrets.TREEHOLE_AUTHORIZATION }}
          TREEHOLE_COOKIE: ${{ secrets.TREEHOLE_COOKIE }}
          TREEHOLE_X_XSRF_TOKEN: ${{ secrets.TREEHOLE_X_XSRF_TOKEN }}
          TREEHOLE_UUID: ${{ secrets.TREEHOLE_UUID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          LOOKBACK_HOURS: "5"
          SEARCH_LIMIT: "50"
